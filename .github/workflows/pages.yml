name: Publicar GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verificar catálogo y preparar publicación
        run: |
          node --test tests/*.test.mjs
          node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Esperar disponibilidad del artefacto de Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in {1..10}; do
            artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id')
            if [ -n "$artifact_id" ]; then
              echo "Artefacto de Pages disponible: $artifact_id"
              exit 0
            fi
            sleep 3
          done
          echo "::error::El artefacto de Pages no está disponible después de la carga."
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
